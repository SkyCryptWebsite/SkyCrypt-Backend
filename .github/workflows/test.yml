name: Test

on:
  workflow_call:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: store
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clone NotEnoughUpdates-REPO
        uses: actions/checkout@v6
        with:
          repository: NotEnoughUpdates/NotEnoughUpdates-REPO
          path: NotEnoughUpdates-REPO/
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Go Setup
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...
        env:
          SKYCRYPT_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/store
