name: Website

on:
  push:
    paths: ["src/**", "Dockerfile", ".github/workflows/website.yml"]
  workflow_dispatch:

env:
  CONTAINER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  tests:
    uses: ./.github/workflows/test.yml

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/dev')
      && github.repository_owner == 'SkyCryptWebsite'
      && github.event_name != 'pull_request'

    permissions:
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  build:
    if: |
      (github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/dev')
      && github.repository_owner == 'SkyCryptWebsite'
      && github.event_name != 'pull_request'
    uses: ./.github/workflows/build.yml

  package:
    name: Package into Container
    runs-on: ubuntu-latest
    needs: [checks, tests, analyze, build]
    if: |
      (github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/dev')
      && github.repository_owner == 'SkyCryptWebsite'
      && github.event_name != 'pull_request'

    permissions:
      packages: write
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Git checkout
        uses: actions/checkout@v6

      - name: Registry login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and Push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
