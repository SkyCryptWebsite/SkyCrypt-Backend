services:
  mongodb:
    image: mongo:8
    container_name: skycrypt-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:8-alpine
    container_name: skycrypt-redis
    restart: unless-stopped
    command: redis-server --maxmemory ${REDIS_MAXMEMORY:-8gb} --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lfu} --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data: