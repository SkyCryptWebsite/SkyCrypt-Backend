version: "3.8"
services:
  skycrypt-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skycrypt-backend
    pid: "host"
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - HYPIXEL_API_KEY=${HYPIXEL_API_KEY}
      - DEV=true
      - ENABLE_ARMOR_HEX=${ENABLE_ARMOR_HEX:-false}
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=${MONGO_DB_NAME:-SkyCrypt}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s
  redis:
    image: redis:latest
    container_name: skycrypt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  mongodb:
    image: mongo:latest
    container_name: skycrypt-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  redis-data:
    driver: local
  mongodb-data:
    driver: local
