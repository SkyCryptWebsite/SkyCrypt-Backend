# PostgreSQL is shared with the frontend (see its docker-compose.yml); the backend uses its own database there.
services:
  redis:
    image: redis:8-alpine
    container_name: skycrypt-redis
    restart: unless-stopped
    # Pure cache: snapshots would rewrite the whole dataset every few minutes for nothing.
    command: redis-server --save "" --appendonly no --maxmemory ${REDIS_MAXMEMORY:-8gb} --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lfu} --requirepass ${REDIS_PASSWORD:-DEV}
    ports:
      - "6379:6379"
